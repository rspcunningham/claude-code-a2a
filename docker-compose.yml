name: fleet-of-agents

networks:
  agent-network:
    driver: bridge

services:
  heartbeat-logger:
    build: .
    command:
      - uv
      - run
      - python
      - heartbeat_receiver.py
    environment:
      HEARTBEAT_PORT: 8080
    ports:
      - target: 8080
        published: 0
        protocol: tcp
    restart: unless-stopped
    networks:
      - agent-network
